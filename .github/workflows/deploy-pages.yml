name: Deploy designs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Design1
        working-directory: Designs/Design1
        run: npm ci && npm run build -- --outDir ../../_site/Design1

      - name: Build Design2
        working-directory: Designs/Design2
        run: npm ci && npm run build -- --outDir ../../_site/Design2

      - name: Build Design3
        working-directory: Designs/Design3
        run: npm ci && npm run build -- --outDir ../../_site/Design3

      - name: Build Design4
        working-directory: Designs/Design4
        run: npm ci && npm run build -- --outDir ../../_site/Design4

      - name: Build Design5
        working-directory: Designs/Design5
        run: npm ci && npm run build -- --outDir ../../_site/Design5

      - name: Add default redirect
        run: cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4